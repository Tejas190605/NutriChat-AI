services:
  # Managed Key Value (Valkey / Redis) Cache & Message Broker
  - type: keyvalue
    name: nutrichat-redis
    region: singapore
    plan: free
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off
    ipAllowList: []

  # FastAPI Backend Web Service (100% Free Tier - Direct Async Processing)
  - type: web
    name: nutrichat-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install poetry && poetry config virtualenvs.create false && poetry install --only main --no-root
    preDeployCommand: poetry run alembic upgrade head
    startCommand: poetry run uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: nutrichat-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: POSTGRES_USER
        fromDatabase:
          name: nutrichat-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: nutrichat-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: nutrichat-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: nutrichat-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: nutrichat-db
          property: database
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nutrichat-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: FACEBOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false

  # Next.js 15 Frontend Web Service
  - type: web
    name: nutrichat-frontend
    runtime: node
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: nutrichat-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: nutrichat-db
    databaseName: nutrichat
    user: nutrichat_user
    postgresMajorVersion: "16"
    plan: free
    region: singapore
