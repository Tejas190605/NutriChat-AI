repos:
  - repos: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black
        files: ^backend/src/

  - repos: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.2
    hooks:
      - id: ruff
        args: [ --fix ]
        files: ^backend/src/

  - repos: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, pydantic-settings, sqlalchemy]
        files: ^backend/src/
