[tool.poetry]
name = "nutrichat-backend"
version = "0.1.0"
description = "FastAPI Backend for NutriChat AI"
authors = ["Antigravity Developer <developer@nutrichat.ai>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.28"}
asyncpg = "^0.29.0"
alembic = "^1.13.1"
redis = "^5.0.3"
celery = "^5.3.6"
structlog = "^24.1.0"
cryptography = "^42.0.5"
python-multipart = "^0.0.9"
argon2-cffi = "^23.1.0"
pyjwt = "^2.8.0"
email-validator = "^2.1.0"

[tool.poetry.group.dev.dependencies]
black = "^24.2.0"
ruff = "^0.3.2"
mypy = "^1.8.0"
pytest = "^8.1.1"
pytest-asyncio = "^0.23.5"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "PT", "ARG"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["migrations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
